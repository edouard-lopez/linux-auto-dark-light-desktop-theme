[theme]
# Latitude in decimal degrees: north is positive, south is negative (-90 to 90).
latitude = 48.85
# Longitude in decimal degrees: east is positive, west is negative (-180 to 180).
longitude = 2.35

# Optional local times in HH:MM (or HH:MM:SS), e.g. 07:00 and 19:00.
# Set both to use a fixed schedule; if either is empty, solar times are used.
# Sunrise must precede sunset: light applies from sunrise up to, but not
# including, sunset. Equal or reversed times result in dark mode all day.
fixed_sunrise =
fixed_sunset =

# Installed GTK theme names for light and dark mode. Leave either empty to
# skip setting the GTK theme in that mode.
light_gtk = Mint-Y
dark_gtk = Mint-Y-Dark

# Installed Cinnamon shell theme names for light and dark mode.
# Leave either empty to skip setting the Cinnamon shell theme in that mode.
light_cinnamon =
dark_cinnamon =
